# FerrumScope — hardware database: AMD
#
# Jak w intel.toml: to NIE jest wpis na każdy SKU. Nazwy marketingowe pochodzą
# z brand stringu CPUID. Baza niesie mikroarchitekturę, kodową nazwę i quirks.
#
# Numeracja AMD (APM, CPUID Fn0000_0001_EAX):
#   Family = family_field + ext_family, gdy family_field = 0x0F
#   Zen / Zen 2   = Family 17h -> ext_family 0x08
#   Zen 3 / Zen 4 = Family 19h -> ext_family 0x0A
#   Zen 5         = Family 1Ah -> ext_family 0x0B
#   display_model = (ext_model << 4) | model
#
# ŹRÓDŁA (rewizja 2026-11-15, wszystkie zakresy przejrzane od nowa):
#   [AMD-RG-19h-00]  AMD Revision Guide, Family 19h Models 00h-0Fh, pub. 56683
#                    rev. 1.08 — Tabela 2: 00A00F11h = Milan-B1,
#                    00A00F12h = Milan-B2 (EPYC 7003 i 7003 z 3D V-Cache = Milan-X).
#                    https://www.amd.com/content/dam/amd/en/documents/processor-tech-docs/revision-guides/56683.pdf
#   [AMD-RG-1Ah-00]  AMD Revision Guide, Family 1Ah Models 00h-0Fh, pub. 58251
#                    rev. 1.10 — 00B00F21h, EPYC 9005 (Turin).
#                    https://www.amd.com/content/dam/amd/en/documents/processor-tech-docs/revision-guides/58251.pdf
#   [LINUX-AMD]      Linux, arch/x86/kernel/cpu/amd.c — przypisanie zakresów
#                    modeli do generacji Zen (X86_FEATURE_ZEN1..ZEN5). Cytowany
#                    jako fakt o zakresach (nie kopiujemy kodu).
#                    https://github.com/torvalds/linux/blob/master/arch/x86/kernel/cpu/amd.c
#   [INSTLAT]        InstLatx64 — publiczne zrzuty CPUID realnych procesorów,
#                    nazwane sygnaturą i nazwą kodową (np. AuthenticAMD0A20F12_
#                    K19_Vermeer). Dowód przypisania nazwy kodowej do modelu.
#                    https://github.com/InstLatx64/InstLatx64/tree/master/AuthenticAMD
#
# Pewność: `high` tylko gdy dokument AMD obejmuje dokładnie ten zakres;
# `medium` gdy mikroarchitekturę potwierdza [LINUX-AMD], a nazwę kodową [INSTLAT];
# `low` gdy jest tylko jedno pośrednie źródło.
#
# Modele bez znalezionego publicznego produktu (np. 17h 40h-5Fh, 19h 30h-3Fh,
# 19h 80h-9Fh) celowo NIE mają wpisu: dekoder pokaże dane z CPUID z niskim
# dopasowaniem, zamiast zgadywać nazwę.

[meta]
schema = "ferrum.hwdb.cpu.v1"
source = "amd-revision-guides + linux-amd.c + instlatx64"
source_rev = "2026-11-15"

