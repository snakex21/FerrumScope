# ---------------------------------------------------------------------------
# Fakty sygnatury: `stepping_name` i `socket_name`.
#
# Osobne od `[[entry]]` **z powodu**, którego nie wolno zgubić w tłumaczeniu:
# `[[entry]]` decyduje `MatchQuality`, a `family_generic` opisuje całą rodzinę.
# Zakres 0x20..0x3F obejmuje desktop (AM4) i serwer (SP3) w jednym wpisie, więc
# wpisanie gniazda do `[[entry]]` wymusiłoby rozbicie tego wpisu — a to zmiana
# semantyki dopasowania, czego świadomie nie chcemy.
#
# `[[fact]]` opisuje sygnaturę precyzyjnie i zostawia trafienie modelu nietknięte.
# ---------------------------------------------------------------------------

# Nazwa kodowa steppingu Vermeer. Zakres **wąski**: tylko Model 0x21 i tylko
# stepping 2 — bo to jedyna sygnatura, którą zmierzyliśmy na realnym sprzęcie.
#
# `VMR-B2` to obserwacja referencyjna, a NIE dokumentacja AMD: publiczne Revision
# Guide obejmują Modele 00h–0Fh i 10h–1Fh, a 20h–2Fh (Vermeer) nie ma. Dlatego
# `source_type = "reference_observation"` i `confidence = "medium"`, nie `high`.
#
# Litera `B` jest obserwacją: cyfra to stepping z CPUID i da się ją wyprowadzić,
# litera nie. `package_contacts` celowo **puste** — 1331 widać w CPU-Z, ale nie
# mamy niezależnego potwierdzenia producenta, więc zostaje `unknown`.
[[fact]]
vendor = "amd"
ext_family = 0x0A
family_field = 0x0F
model_min = 0x21
model_max = 0x21
stepping_min = 0x02
stepping_max = 0x02
stepping_name = "VMR-B2"
source_type = "reference_observation"
source = "cpu-z-3.01.0-txt"
source_url = "local oracle: do referencji/cpuz/cpuz_x64.exe -txt (CPU-Z 3.01.0, Core Stepping: VMR-B2)"
confidence = "medium"
notes = "Cyfra 2 = stepping CPUID, wyprowadzalna. Prefiks VMR i litera B = obserwacja referencyjna, nie wyprowadzane. Brak pierwotnego źródła AMD dla Models 20h-2Fh. package_contacts puste: brak potwierdzenia producenta dla 1331."

# Gniazdo zmierzonego desktopowego Vermeer (Ryzen 5000 na AM4).
#
# Zakres wąski **celowo**: model 0x21 to desktop, a w szerokim wpisie 0x20..0x3F
# siedzi również EPYC 7003 (Milan-X) na SP3. Gdybyśmy wpisali AM4 do `[[entry]]`
# dla całego zakresu, pokazalibyśmy złe gniazdo każdemu EPYC.
#
# `source_type = "derived"`: gniazdo pochodzi z dokumentacji procesora, ale
# **przypisanie** go do sygnatury 0x21 to nasz wniosek z pomiaru, nie cytat.
[[fact]]
vendor = "amd"
ext_family = 0x0A
family_field = 0x0F
model_min = 0x21
model_max = 0x21
stepping_min = 0x00
stepping_max = 0xFF
socket_name = "AM4"
source_type = "derived"
source = "amd-product-docs + measurement-5800x3d"
source_url = "https://www.amd.com/en/products/processors/desktops/ryzen/5000-series/amd-ryzen-7-5800x3d.html"
confidence = "medium"
notes = "AM4 = dokumentacja Ryzen 5000 desktop; powiązanie z Model 0x21 = wniosek z pomiaru. Nie dotyczy 0x2F/0x30 (Milan-X, SP3) — tego podziału nie potwierdziliśmy."

# ---------------------------------------------------------------------------
# Reguły refinamentu z brand stringu.
#
# Sygnatura CPUID `5800X` i `5800X3D` jest **identyczna** (0x00A20F12 na naszym
# sprzęcie). Różni je wyłącznie brand string, więc wariant musi być wyprowadzony
# z brandu — ale przez **dane**, nie przez `if` rozsiany po decoderze.
#
# `vendor` jest obowiązkowy (walidator odrzuca `unknown`/`other`), więc wzorzec
# „5800X3D” nigdy nie trafi w procesor innego producenta.
# ---------------------------------------------------------------------------

# Wariant 3D V-Cache. Wzorzec dopasowywany w znormalizowanym brand stringu
# (obcięte krawędzie, scalone spacje), zakres ograniczony do AMD Zen 3 desktop.
#
# Reguła wzbogaca **wyłącznie** `product_name` / `variant` / `cache_variant`.
# Nie rusza `vendor`, `family`, `model`, `stepping`, topologii ani cache
# zmierzonego ze sprzętu — brand nie ma prawa zmienić odczytu CPUID.
[[brand_rule]]
vendor = "amd"
ext_family = 0x0A
family_field = 0x0F
model_min = 0x20
model_max = 0x2F
brand_pattern = "5800X3D"
product_name = "Ryzen 7 5800X3D"
variant = "3D V-Cache"
cache_variant = "3D V-Cache"
source_type = "derived"
source = "brand-string-5800x3d"
source_url = "CPUID brand string 0x80000002..4, zmierzony na 5800X3D"
confidence = "high"
notes = "Sygnatura CPUID nie rozróżnia 5800X i 5800X3D. Reguła wzbogaca tylko product_name/variant/cache_variant; vendor/family/model/stepping/topologia/cache zostają nietknięte."

