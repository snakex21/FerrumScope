# FerrumScope — hardware database: AMD
#
# Jak w intel.toml: to NIE jest wpis na każdy SKU. Nazwy marketingowe pochodzą
# z brand stringu CPUID. Baza niesie mikroarchitekturę, kodową nazwę i quirks.
#
# AMD używa numeracji extended intensywniej niż Intel:
#   Zen 1  = Family 17h  -> ext_family = 0x08, family_field = 0x0F
#   Zen 3+ = Family 19h  -> ext_family = 0x0A, family_field = 0x0F
# Reguła SDM/APM: display_model = (ext_model << 4) | model dla rodziny 0x0F.
#
# Źródła:
#   AMD64 Architecture Programmer's Manual (APM), rozdz. "CPUID Fn0000_0001"
#   AMD "Family 19h Model ..h" identification tables (publiczne)
#   AMD product pages dla kodowych nazw (Vermeer, Raphael, Genoa, Turin)

[meta]
schema = "ferrum.hwdb.cpu.v1"
source = "amd-apm + amd-pub"
source_rev = "2026-09-29"

