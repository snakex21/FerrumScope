# FerrumScope — hardware database: Intel
#
# UWAGA: to NIE jest wpis na każdy SKU. Nazwy marketingowe ("Intel Core i7-13700K")
# pochodzą z brand stringu CPUID 0x80000002..4, który procesor sam zwraca.
# Baza niesie to, czego CPUID **nie** mówi: mikroarchitekturę, kodową nazwę
# pokolenia i dziwactwa wymagające innego traktowania przez dekoder.
#
# Pola obowiązkowe (brak = błąd kompilacji):
#   vendor, ext_family, family_field, model_min, model_max, uarch,
#   source, confidence;  source_url gdy confidence != "low"
#
# Źródła:
#   Intel SDM, "CPUID.01H:EAX" oraz tabela family/model (rozd. 2.1)
#   Intel ARK (ark.intel.com) dla kodowych nazw pokoleń
#
# Numeracja: dla Intela ext_family = 0, family_field = 6; reguła SDM
# "display_model" używa rozszerzonego modelu (ext_model << 4 | model).

[meta]
schema = "ferrum.hwdb.cpu.v1"
source = "intel-sdm + intel-ark"
source_rev = "2026-09-29"

